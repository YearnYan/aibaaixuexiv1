<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>题感训练</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet" href="/shared/jx-brand.css?v=20260527readable">
    <link rel="stylesheet" href="./aiba-brand.css" data-aiba-brand />
      <link rel="icon" href="data:," data-aiba-icon />
  </head>
<body>
  <div class="container">
    <div class="header">
      <h1>题感训练</h1>
      <p>做100道题不如看透10道题</p>
    </div>

    <div class="stats-bar">
      <div class="stat">
        <div class="stat-value" id="totalCount">0</div>
        <div class="stat-label">已训练</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="avgScore">-</div>
        <div class="stat-label">正确率</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="streak">0</div>
        <div class="stat-label">连续正确</div>
      </div>
    </div>

    <!-- Screen 1: Setup -->
    <div class="screen active" id="setupScreen">
      <div class="card">
        <div class="setup-section">
          <h3>选择年级</h3>
          <div class="grade-grid" id="gradeGrid"></div>
        </div>
        <div class="setup-section">
          <h3>选择学科</h3>
          <div class="subject-grid" id="subjectGrid"></div>
        </div>
        <div class="setup-section">
          <h3>输入知识点</h3>
          <label class="knowledge-field" for="knowledgeInput">
            <input id="knowledgeInput" type="text" maxlength="60" placeholder="例如：二次函数图像、浮力、化学方程式配平、光合作用..." autocomplete="off">
          </label>
          <p class="knowledge-hint">后续题目会围绕这个知识点连续训练。</p>
        </div>
        <p class="training-note">默认快速训练：一次生成10题，完整生成后逐题作答并即时反馈。</p>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled onclick="startTraining()">开始训练</button>
    </div>

    <!-- Screen 2: Loading -->
    <div class="screen" id="loadingScreen">
      <div class="loading">
        <div class="loading-bar" aria-hidden="true"><span></span></div>
        <div class="loading-text" id="loadingText">AI正在准备题目...</div>
        <div class="loading-progress" id="loadingProgress"></div>
      </div>
    </div>

    <!-- Screen 3: Question -->
    <div class="screen" id="questionScreen">
      <div id="progressBar" class="progress-bar" style="display:none;"></div>

      <div class="card fade-in">
        <div class="question-header">
          <span class="question-badge" id="diffBadge"></span>
          <span class="question-num" id="questionNum"></span>
        </div>
        <div class="question-text" id="questionText"></div>
      </div>

      <!-- Step indicator -->
      <div class="step-indicator" id="stepIndicator">
        <div class="step-dot active" id="stepDot0"></div>
        <div class="step-dot" id="stepDot1"></div>
        <div class="step-dot" id="stepDot2"></div>
      </div>

      <!-- Single choice area, content swaps per step -->
      <div class="card fade-in" id="choiceCard">
        <div class="choice-group">
          <div class="choice-step-num" id="choiceStepNum">1 / 3</div>
          <div class="choice-label" id="choiceLabel"></div>
          <div class="choice-options" id="choiceOptions"></div>
        </div>
      </div>
    </div>

    <!-- Screen 4: Feedback -->
    <div class="screen" id="feedbackScreen">
      <div class="score-display fade-in">
        <div class="score-number" id="scoreNum"></div>
        <div class="score-label">答对 / 3</div>
      </div>
      <div class="card fade-in" id="evalContainer"></div>
      <div class="card fade-in">
        <div class="correct-analysis" id="correctAnalysis"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="backToSetup()">返回</button>
        <button class="btn btn-primary" id="feedbackNextBtn" onclick="nextQuestion()">下一题</button>
      </div>
    </div>

    <!-- Screen 5: Batch Summary -->
    <div class="screen" id="summaryScreen">
      <div class="score-display fade-in">
        <div class="score-number" id="summaryScore"></div>
        <div class="score-label">本轮总分（满分30）</div>
      </div>
      <div class="card fade-in" id="summaryList"></div>
      <div class="card fade-in">
        <div class="score-tip" id="summaryTip"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="backToSetup()">返回首页</button>
        <button class="btn btn-primary" id="continueBtn" onclick="continueTraining()">继续生成10题</button>
      </div>
    </div>
  </div>

  <div class="buffer-indicator" id="bufferIndicator"></div>

  <script>
  window.onerror = function(msg, url, line, col, err) {
    console.error('Global error:', msg, 'at', url, line, col, err);
    var el = document.getElementById('loadingText');
    if (el) el.textContent = 'Error: ' + msg;
  };
  </script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/mhchem.min.js"></script>
  <script src="app.js"></script>

  <script src="/shared/hzq.js?v=20260711-brandnav2"></script>
  <script>if (window.HZQ && typeof window.HZQ.init === 'function') HZQ.init('题感训练');</script>
</body>
</html>
