server {
    listen 80;
    listen [::]:80;
    server_name jiaofu.jiaoshiai.top;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/jiaofu.jiaoshiai.top/public;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jiaofu.jiaoshiai.top;

    ssl_certificate /etc/letsencrypt/live/jiaofu.jiaoshiai.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiaofu.jiaoshiai.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 100m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1900s;
        proxy_read_timeout 1900s;
    }
}
