<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI题型提分卡</title>
    <link rel="stylesheet" href="/styles.css" />
      <link rel="stylesheet" href="./aiba-brand.css?v=20260801-brand3" data-aiba-brand />
      <link rel="icon" href="data:," data-aiba-icon />
      <script src="./aiba-subsite-nav.js?v=20260804-nav6" data-aiba-subsite-nav defer></script>
      <link rel="stylesheet" href="./aiba-subsite-nav.css?v=20260804-nav6" data-aiba-subsite-nav-style />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar panel">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <div>
            <h1>AI题型提分卡</h1>
            <p>为老师节省备课时间</p>
          </div>
        </div>

        <form id="analysisForm" class="control-form">
          <label class="field">
            <span>年级</span>
            <select name="grade" required>
              <option>初中八年级</option>
              <option>初中七年级</option>
              <option>初中九年级</option>
              <option>小学高年级</option>
              <option>高中一年级</option>
              <option>高中二年级</option>
              <option>高中三年级</option>
            </select>
          </label>

          <label class="field">
            <span>科目</span>
            <select name="subject" required>
              <option>数学</option>
              <option>语文</option>
              <option>英语</option>
              <option>物理</option>
              <option>化学</option>
              <option>生物</option>
              <option>历史</option>
              <option>地理</option>
              <option>政治</option>
            </select>
          </label>

          <label class="field">
            <span>题型名称</span>
            <input name="topic" placeholder="选填，不填则由AI根据题目识别" />
          </label>

          <div class="upload-label">上传题目文件</div>
          <div id="dropZone" class="upload-box" tabindex="0">
            <input
              id="fileInput"
              type="file"
              name="files"
              multiple
              accept=".pdf,.docx,.txt,.md,.csv,.png,.jpg,.jpeg,.webp"
            />
            <div class="upload-empty">
              <div class="upload-cloud" aria-hidden="true">
                <svg viewBox="0 0 48 48" role="img">
                  <path d="M18.9 35.5H15a9 9 0 0 1-.5-18A11.2 11.2 0 0 1 36 21.2a7.2 7.2 0 0 1-1.2 14.3H29" fill="currentColor" opacity=".18"/>
                  <path d="M24 36V18m0 0-7 7m7-7 7 7" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
              <p>点击或拖拽文件到此处上传</p>
              <span>支持 PDF、Word、PNG、JPG</span>
              <button type="button" id="exampleBtn" class="link-button">查看示例</button>
            </div>
            <div id="fileList" class="file-list" hidden></div>
          </div>

          <button id="generateBtn" class="generate-button" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7L12 3Z" fill="currentColor"/>
              <path d="m19 15 .8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15ZM5 14l.6 1.5L7 16l-1.4.5L5 18l-.6-1.5L3 16l1.4-.5L5 14Z" fill="currentColor"/>
            </svg>
            <span>生成题型提分卡</span>
          </button>
        </form>

        <div class="help-card">
          <div class="help-title">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3a7 7 0 0 0-4.2 12.6c.5.4.8.9.8 1.5v.4h6.8v-.4c0-.6.3-1.1.8-1.5A7 7 0 0 0 12 3Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <path d="M9 21h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <strong>使用提示</strong>
          </div>
          <ul>
            <li>上传含题目的文件，AI 将自动识别题型并生成提分卡</li>
            <li>结果包含教学分析、方法步骤、跟练题及建议</li>
          </ul>
        </div>
      </aside>

      <main id="reportPanel" class="report-panel panel">
        <header class="report-top">
          <div class="title-wrap">
            <div class="title-icon" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
            <h2>题型提分报告</h2>
          </div>
          <div class="actions">
            <button id="exportBtn" class="outline-button" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3v11m0 0 4-4m-4 4-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 17v3h14v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              导出报告（PDF）
            </button>
            <button id="regenBtn" class="ghost-button" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 12a8 8 0 0 1-14.9 4M4 12A8 8 0 0 1 18.9 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M5 20v-4h4M19 4v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              重新生成
            </button>
          </div>
        </header>

        <div id="statusBar" class="status-bar" hidden>
          <span class="spinner"></span>
          <span id="statusText">AI 正在分析题目资料...</span>
        </div>

        <div id="reportRoot" class="report-root"></div>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/app.js" defer></script>
  </body>
</html>
